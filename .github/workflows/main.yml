name: Deploy Release Branches

# 触发条件：仅 release/** 分支自动部署
on:
  push:
    branches:
      - 'release/**'  # 仅发布分支触发（如 release/v1.0.0、release/hotfix-login）

# 🔒 并发控制：防止多个 release 分支同时部署导致覆盖
concurrency:
  group: gk-work-deploy-${{ github.ref }}  # 按分支分组（不同 release 分支排队）
  cancel-in-progress: true  # 新推送自动取消旧的部署任务

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Extract branch name
        shell: bash
        run: echo "BRANCH_NAME=${GITHUB_REF#refs/heads/}" >> $GITHUB_ENV

      - name: Deploy to production or test environment
        run: |
          echo "=================================================="
          echo "📦 准备部署"
          echo "   源分支: ${{ env.BRANCH_NAME }}"
          echo "=================================================="

          # 将分支名进行 URL 编码（/ → %2F）
          # 例如: release/1.0.0.1 → release%2F1.0.0.1
          BRANCH_PARAM=$(echo "${{ env.BRANCH_NAME }}" | sed 's/\//%2F/g')
          echo "   URL参数: $BRANCH_PARAM"

          # 根据分支名判断环境
          echo ""
          echo "🧪 目标环境: 测试线 (Test)"
          echo "   服务器: 34.81.124.226"
          WEBHOOK_URL="https://34.81.124.226:14843/hook?access_key=VA7Uj5LdFuBkmsnUB4bdw64ji89fffYF9Yb1N71i4OLpCPEE&param=$BRANCH_PARAM"
          echo ""
          echo "📡 触发 Webhook..."
          if curl -k -X GET "$WEBHOOK_URL" -w "\n状态码: %{http_code}\n"; then
            echo ""
            echo "✅ Webhook 触发成功！"
          else
            echo ""
            echo "❌ Webhook 触发失败！"
            exit 1
          fi
          echo "=================================================="
